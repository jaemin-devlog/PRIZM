spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
  ai:
    model:
      chat: none
      embedding: ollama
    ollama:
      # Do not inherit a potentially remote general-purpose .env endpoint during
      # personal evaluation. An explicit evaluation-only override is required.
      base-url: ${PRIZM_SEARCH_EVALUATION_OLLAMA_BASE_URL:http://localhost:11434}

prizm:
  jwt:
    secret: search-evaluation-jwt-secret-at-least-32-characters-long
    expiration-seconds: 3600
    issuer: prizm
  ingestion:
    worker-enabled: false
  cleanup:
    worker-enabled: false
