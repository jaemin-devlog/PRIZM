spring:
  datasource:
    url: ${PRIZM_DB_URL}
    username: ${PRIZM_DB_USERNAME}
    password: ${PRIZM_DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: ${PRIZM_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${PRIZM_DB_MIN_IDLE:1}
  flyway:
    url: ${PRIZM_FLYWAY_URL}
    user: ${PRIZM_FLYWAY_USERNAME}
    password: ${PRIZM_FLYWAY_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
