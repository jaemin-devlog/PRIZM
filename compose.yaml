name: ${COMPOSE_PROJECT_NAME:-prizm}

services:
  db:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    environment:
      POSTGRES_DB: ${PRIZM_DB_NAME:?Copy .env.example to .env first}
      POSTGRES_USER: ${PRIZM_FLYWAY_USERNAME:?Set PRIZM_FLYWAY_USERNAME in .env}
      POSTGRES_PASSWORD: ${PRIZM_FLYWAY_PASSWORD:?Set PRIZM_FLYWAY_PASSWORD in .env}
      PRIZM_DB_USERNAME: ${PRIZM_DB_USERNAME:?Set PRIZM_DB_USERNAME in .env}
      PRIZM_DB_PASSWORD: ${PRIZM_DB_PASSWORD:?Set PRIZM_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PRIZM_DB_PORT:?Set PRIZM_DB_PORT in .env}:5432"
    volumes:
      - prizm-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/00-create-runtime-role.sh:/docker-entrypoint-initdb.d/00-create-runtime-role.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U ${PRIZM_FLYWAY_USERNAME} -d ${PRIZM_DB_NAME}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      PRIZM_DB_HOST: db
      PRIZM_DB_PORT: 5432
      PRIZM_STORAGE_ROOT: /app/var/storage
      PRIZM_STORAGE_TEMP: /app/var/tmp
      PRIZM_OLLAMA_BASE_URL: ${PRIZM_COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    volumes:
      - prizm-runtime-data:/app/var
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:${PRIZM_FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  prizm-postgres-data:
  prizm-runtime-data:
