plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.prizm'
version = '0.0.1-SNAPSHOT'
description = 'PRIZM personal career evidence document platform'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '2.0.0')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += '-parameters'
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }

    searchEvaluation {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    searchEvaluationImplementation.extendsFrom testImplementation
    searchEvaluationRuntimeOnly.extendsFrom testRuntimeOnly
}

sourceSets.test.compileClasspath += sourceSets.searchEvaluation.output
sourceSets.test.runtimeClasspath += sourceSets.searchEvaluation.output

tasks.named('compileTestJava') {
    dependsOn tasks.named('compileSearchEvaluationJava')
}

tasks.register('integrationTest', Test) {
    description = 'Runs infrastructure integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    useJUnitPlatform()
}

tasks.register('searchEvaluation', Test) {
    description = 'Measures the current dense search baseline with PostgreSQL, pgvector, and Ollama.'
    group = 'verification'
    testClassesDirs = sourceSets.searchEvaluation.output.classesDirs
    classpath = sourceSets.searchEvaluation.runtimeClasspath
    useJUnitPlatform()
    outputs.upToDateWhen { false }

    systemProperty 'prizm.search-evaluation.dataset-dir',
            providers.gradleProperty('searchEvaluationDataset')
                    .getOrElse('src/test/resources/search-evaluation/sample')
    systemProperty 'prizm.search-evaluation.output-dir',
            providers.gradleProperty('searchEvaluationOutput')
                    .getOrElse('local/search-evaluation/results')

    testLogging {
        showStandardStreams = true
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}
