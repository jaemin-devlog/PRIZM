spring:
  application:
    name: PRIZM
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  ai:
    model:
      chat: none
      embedding: ollama
    ollama:
      base-url: ${PRIZM_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      embedding:
        model: ${PRIZM_EMBEDDING_MODEL:bge-m3}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

prizm:
  jwt:
    secret: ${PRIZM_JWT_SECRET:}
    expiration-seconds: ${PRIZM_JWT_EXPIRATION_SECONDS:3600}
    issuer: ${PRIZM_JWT_ISSUER:prizm}
  security:
    allowed-origins: ${PRIZM_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-system-admin:
    enabled: ${PRIZM_BOOTSTRAP_SYSTEM_ADMIN_ENABLED:false}
    email: ${PRIZM_BOOTSTRAP_SYSTEM_ADMIN_EMAIL:}
    password: ${PRIZM_BOOTSTRAP_SYSTEM_ADMIN_PASSWORD:}
  bootstrap-demo-user:
    enabled: ${PRIZM_BOOTSTRAP_DEMO_USER_ENABLED:false}
    email: ${PRIZM_BOOTSTRAP_DEMO_USER_EMAIL:}
    password: ${PRIZM_BOOTSTRAP_DEMO_USER_PASSWORD:}
  storage:
    root: ${PRIZM_STORAGE_ROOT:./var/storage}
    temp: ${PRIZM_STORAGE_TEMP:./var/tmp}
  upload:
    max-file-size-bytes: ${PRIZM_UPLOAD_MAX_FILE_SIZE_BYTES:10485760}
  document:
    pdf:
      max-pages: ${PRIZM_DOCUMENT_PDF_MAX_PAGES:300}
      max-extracted-characters: ${PRIZM_DOCUMENT_PDF_MAX_EXTRACTED_CHARACTERS:2000000}
  embedding:
    dimensions: ${PRIZM_EMBEDDING_DIMENSIONS:1024}
  change-log:
    scheduler:
      enabled: ${PRIZM_CHANGE_LOG_SCHEDULER_ENABLED:true}
      poll-delay-ms: ${PRIZM_CHANGE_LOG_SCHEDULER_POLL_DELAY_MS:1000}
  ingestion:
    max-chunk-length: ${PRIZM_MAX_CHUNK_LENGTH:800}
    overlap: ${PRIZM_CHUNK_OVERLAP:120}
    poll-delay-ms: ${PRIZM_INDEXING_POLL_DELAY_MS:1000}
    lease-duration: ${PRIZM_INDEXING_LEASE_DURATION:10m}
    lease-refresh-chunk-interval: ${PRIZM_INDEXING_LEASE_REFRESH_CHUNK_INTERVAL:10}
    recovery-delay-ms: ${PRIZM_INDEXING_RECOVERY_DELAY_MS:60000}
    worker-enabled: ${PRIZM_INDEXING_WORKER_ENABLED:true}
  cleanup:
    worker-enabled: ${PRIZM_CLEANUP_WORKER_ENABLED:true}
    poll-delay-ms: ${PRIZM_CLEANUP_POLL_DELAY_MS:5000}
    recovery-delay-ms: ${PRIZM_CLEANUP_RECOVERY_DELAY_MS:60000}
    batch-size: ${PRIZM_CLEANUP_BATCH_SIZE:10}
    lease-duration: ${PRIZM_CLEANUP_LEASE_DURATION:5m}
