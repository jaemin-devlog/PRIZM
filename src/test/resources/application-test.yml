spring:
  datasource:
    url: jdbc:h2:mem:prizm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  ai:
    model:
      chat: none
      embedding: ollama

prizm:
  jwt:
    secret: unit-test-jwt-secret-at-least-32-characters-long
    expiration-seconds: 3600
    issuer: prizm
  ingestion:
    worker-enabled: false
