name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Prepare local environment file
        run: cp .env.example .env
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Verify Docker engine
        run: docker info
      - name: Restore Gradle wrapper executable bit
        run: chmod +x gradlew
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install pinned Ollama archive
        env:
          OLLAMA_VERSION: "0.32.3"
          OLLAMA_LINUX_AMD64_SHA256: "2597d74fbe654ef6a37db56f771cf37d4a85c6bde4018127874e3927d3113800"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          curl --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          echo "${OLLAMA_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar --extract --file "$archive" --directory /usr
      - name: Start Ollama and verify pinned embedding model
        env:
          OLLAMA_VERSION: "0.32.3"
          BGE_M3_MODEL: "bge-m3:latest"
          BGE_M3_MANIFEST_SHA256: "7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab"
          BGE_M3_MODEL_BLOB_SHA256: "daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c"
          BGE_M3_LICENSE_BLOB_SHA256: "a406579cd136771c705c521db86ca7d60a6f3de7c9b5460e6193a2df27861bde"
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/bge-m3-manifest.json"
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://registry.ollama.ai/v2/library/bge-m3/manifests/latest" \
            --output "$manifest"
          echo "${BGE_M3_MANIFEST_SHA256}  ${manifest}" | sha256sum --check --strict

          ollama serve > /tmp/ollama.log 2>&1 &
          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/version > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "Ollama did not become ready within 60 seconds." >&2
            exit 1
          fi

          actual_version="$(
            curl -fsS http://127.0.0.1:11434/api/version \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])'
          )"
          test "$actual_version" = "$OLLAMA_VERSION"

          ollama pull "$BGE_M3_MODEL"
          local_manifest="$HOME/.ollama/models/manifests/registry.ollama.ai/library/bge-m3/latest"
          echo "${BGE_M3_MANIFEST_SHA256}  ${local_manifest}" | sha256sum --check --strict
          test -f "$HOME/.ollama/models/blobs/sha256-${BGE_M3_MODEL_BLOB_SHA256}"
          test -f "$HOME/.ollama/models/blobs/sha256-${BGE_M3_LICENSE_BLOB_SHA256}"
      - name: Verify backend and pgvector infrastructure
        run: ./gradlew check --no-daemon --dependency-verification=strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify clean-clone tooling
        run: node --test scripts/clean-clone-demo.test.mjs
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
