plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.prizm'
version = '0.0.1-SNAPSHOT'
description = 'PRIZM personal career evidence document platform'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '2.0.0')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += '-parameters'
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }

    searchEvaluation {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    searchEvaluationImplementation.extendsFrom testImplementation
    searchEvaluationRuntimeOnly.extendsFrom testRuntimeOnly
}

sourceSets.test.compileClasspath += sourceSets.searchEvaluation.output
sourceSets.test.runtimeClasspath += sourceSets.searchEvaluation.output

tasks.named('compileTestJava') {
    dependsOn tasks.named('compileSearchEvaluationJava')
}

tasks.register('integrationTest', Test) {
    description = 'Runs infrastructure integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    useJUnitPlatform()
}

tasks.register('searchEvaluation', Test) {
    description = 'Measures the current dense search baseline with PostgreSQL, pgvector, and Ollama.'
    group = 'verification'
    testClassesDirs = sourceSets.searchEvaluation.output.classesDirs
    classpath = sourceSets.searchEvaluation.runtimeClasspath
    useJUnitPlatform()
    outputs.upToDateWhen { false }

    systemProperty 'prizm.search-evaluation.dataset-dir',
            providers.gradleProperty('searchEvaluationDataset')
                    .getOrElse('src/test/resources/search-evaluation/sample')
    systemProperty 'prizm.search-evaluation.output-dir',
            providers.gradleProperty('searchEvaluationOutput')
                    .getOrElse('local/search-evaluation/results')

    testLogging {
        showStandardStreams = true
    }
}

tasks.register('p6ShadowBenchmark', Test) {
    description = 'Runs the PRZ-016 P6 external-corpus retrieval shadow benchmark.'
    group = 'verification'
    testClassesDirs = sourceSets.searchEvaluation.output.classesDirs
    classpath = sourceSets.searchEvaluation.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.prizm.search.evaluation.P6ShadowBenchmarkTest'
    }
    outputs.upToDateWhen { false }
    systemProperty 'prizm.p6.output-dir',
            providers.gradleProperty('p6Output')
                    .getOrElse('specs/PRZ-016-search-performance-v2/p6-retrieval-shadow')
    systemProperty 'prizm.p6.phase',
            providers.gradleProperty('p6Phase').getOrElse('B')

    testLogging {
        showStandardStreams = true
    }
}

tasks.register('p6FreezeIdentifierStressSet', Test) {
    description = 'Validates and freezes the PRZ-016 P6 identifier stress set before H2.'
    group = 'verification'
    testClassesDirs = sourceSets.searchEvaluation.output.classesDirs
    classpath = sourceSets.searchEvaluation.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.prizm.search.evaluation.P6StressSetFreezeTest'
    }
    outputs.upToDateWhen { false }
    systemProperty 'prizm.p6.output-dir',
            providers.gradleProperty('p6Output')
                    .getOrElse('specs/PRZ-016-search-performance-v2/p6-retrieval-shadow')
}

tasks.register('gptEvidenceJudgeShadow', Test) {
    description = 'Runs the PRZ-016 GPT-J1 P5 evidence-judge shadow comparison.'
    group = 'verification'
    testClassesDirs = sourceSets.searchEvaluation.output.classesDirs
    classpath = sourceSets.searchEvaluation.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.prizm.search.evaluation.GptEvidenceJudgeShadowBenchmarkTest'
    }
    outputs.upToDateWhen { false }
    systemProperty 'prizm.gpt-evidence-judge.output',
            providers.gradleProperty('gptJudgeOutput')
                    .getOrElse('local/gpt-evidence-judge/results.json')

    testLogging {
        showStandardStreams = true
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

// Produces a deterministic CycloneDX 1.6 runtime dependency inventory for the
// source-only release. This task uses Gradle's resolved runtimeClasspath and
// Groovy/JDK classes already present in the build; it does not add an external
// SBOM plugin or package to the distributed source tree.
tasks.register('generateBackendSbom') {
    inputs.files(configurations.runtimeClasspath)
    outputs.file(layout.projectDirectory.file('sbom/prizm-backend-runtime.cdx.json'))

    doLast {
        def encodePurlSegment = { value ->
            java.net.URLEncoder.encode(value.toString(), 'UTF-8').replace('+', '%20')
        }
        def sha256 = { candidate ->
            java.security.MessageDigest.getInstance('SHA-256')
                    .digest(candidate.bytes)
                    .encodeHex()
                    .toString()
        }
        def components = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .collect { artifact ->
                    def module = artifact.moduleVersion.id
                    def classifier = artifact.classifier
                    def qualifier = classifier ? "?classifier=${encodePurlSegment(classifier)}" : ''
                    def purl = "pkg:maven/${encodePurlSegment(module.group)}/${encodePurlSegment(module.name)}@${encodePurlSegment(module.version)}${qualifier}"
                    def properties = [[name: 'prizm:configuration', value: 'runtimeClasspath']]
                    if (classifier) {
                        properties.add([name: 'prizm:maven-classifier', value: classifier])
                    }
                    [
                            type              : 'library',
                            'bom-ref'         : purl,
                            group             : module.group,
                            name              : module.name,
                            version           : module.version,
                            purl              : purl,
                            scope             : 'required',
                            hashes            : [[alg: 'SHA-256', content: sha256(artifact.file)]],
                            externalReferences: [[
                                    type: 'distribution',
                                    url : "https://repo1.maven.org/maven2/${module.group.replace('.', '/')}/${module.name}/${module.version}/${artifact.file.name}"
                            ]],
                            properties        : properties
                    ]
                }
                .sort { left, right -> left.purl <=> right.purl }

        def rootPurl = "pkg:maven/${encodePurlSegment(project.group)}/${encodePurlSegment('prizm')}@${encodePurlSegment(project.version)}"
        def bom = [
                bomFormat  : 'CycloneDX',
                specVersion: '1.6',
                version    : 1,
                metadata   : [
                        component : [
                                type     : 'application',
                                'bom-ref': rootPurl,
                                group    : project.group,
                                name     : 'prizm',
                                version  : project.version.toString(),
                                purl     : rootPurl
                        ],
                        properties: [[name: 'prizm:source', value: 'Gradle runtimeClasspath']]
                ],
                components : components
        ]
        def target = layout.projectDirectory.file('sbom/prizm-backend-runtime.cdx.json').asFile
        target.parentFile.mkdirs()
        target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bom)) + '\n', 'UTF-8')
    }
}
