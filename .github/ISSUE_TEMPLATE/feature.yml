name: 기능 제안
description: PRIZM의 현재 범위와 연결되는 기능을 제안해 주세요.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        먼저 기존 Issue와 specs/README.md를 확인해 주세요. 구현 전에 문제와 검증 방법을 합의합니다.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 기능 이름보다 사용자가 겪는 문제를 먼저 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 필요한 동작과 기대 결과를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 기존 기능으로 해결하기 어려운 이유가 있다면 적어 주세요.
  - type: checkboxes
    id: principles
    attributes:
      label: 프로젝트 원칙 확인
      options:
        - label: 문서에 없는 경력·기술·성과를 생성하는 기능이 아닙니다.
          required: true
        - label: 사용자별 데이터와 ACTIVE 버전 경계를 유지해야 함을 이해했습니다.
          required: true
